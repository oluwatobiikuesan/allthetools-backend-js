version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: video-downloader-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  app:
    build: .
    container_name: video-downloader-app
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOWNLOAD_DIR=/app/downloads
      - YTDLP_PATH=/usr/local/bin/yt-dlp
      - YOUTUBE_COOKIES_PATH=/app/cookies/youtube.txt
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./cookies:/app/cookies
      # Exclude node_modules and bin to prevent conflicts
      - /app/node_modules
      - /app/bin
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
