services:
  redis:
    image: redis:7-alpine
    container_name: video-downloader-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # PO Token provider — generates YouTube PO Tokens to bypass
  # "Sign in to confirm you're not a bot" on datacenter IPs.
  # yt-dlp's bgutil plugin connects to this server on port 4416.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:deno
    container_name: video-downloader-pot-provider
    ports:
      - "4416:4416"
    restart: unless-stopped

  app:
    build: .
    container_name: video-downloader-app
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOWNLOAD_DIR=/app/downloads
      - YTDLP_PATH=/usr/local/bin/yt-dlp
      - YOUTUBE_COOKIES_PATH=/app/cookies/youtube.txt
      # PO Token provider URL (bgutil plugin reads this)
      - BGUTIL_POT_BASE_URL=http://pot-provider:4416
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./cookies:/app/cookies
      # Exclude node_modules and bin to prevent conflicts
      - /app/node_modules
      - /app/bin
    depends_on:
      - redis
      - pot-provider
    restart: unless-stopped

volumes:
  redis-data:
